appId: com.vocabulario.app
tags:
  - lists
---
# H-03 · Create list happy
- launchApp:
    clearState: false
- runFlow: ../../helpers/ensure-logged-in.yaml
- tapOn:
    id: tab_lists
- tapOn:
    id: btn_new_list
- extendedWaitUntil:
    visible:
      id: sheet_list_name
    timeout: 10000
- tapOn:
    id: sheet_list_name
- inputText: "E2E List"
- tapOn:
    id: dialog_confirm
- extendedWaitUntil:
    visible: "E2E List"
    timeout: 20000
