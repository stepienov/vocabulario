appId: com.vocabulario.app
tags:
  - regression
  - practice
  - settings
---
# I-03 · Choice mode — tap first choice (seeded cards required)
- launchApp:
    clearState: false
- runFlow: ../../helpers/ensure-logged-in.yaml
- runFlow: ../../helpers/goto-settings.yaml
- tapOn:
    id: settings_section_mode
- tapOn:
    id: settings_mode_choice
- tapOn:
    id: btn_back
- tapOn:
    id: btn_learn
- extendedWaitUntil:
    visible:
      id: "practice_choice|practice_empty_back"
    timeout: 45000
- runFlow:
    when:
      visible:
        id: practice_choice
    commands:
      - tapOn:
          id: practice_choice
      - extendedWaitUntil:
          visible:
            id: "grade_good|practice_wrong_dismiss|practice_choice"
          timeout: 20000
      - runFlow:
          when:
            visible:
              id: practice_wrong_dismiss
          commands:
            - tapOn:
                id: practice_wrong_dismiss
            - tapOn:
                id: practice_choice
            - extendedWaitUntil:
                visible:
                  id: grade_good
                timeout: 20000
      - runFlow:
          when:
            visible:
              id: grade_good
          commands:
            - tapOn:
                id: grade_good
- runFlow:
    when:
      visible:
        id: practice_empty_back
    commands:
      - tapOn:
          id: practice_empty_back
- runFlow:
    when:
      visible:
        id: btn_back
    commands:
      - tapOn:
          id: btn_back
