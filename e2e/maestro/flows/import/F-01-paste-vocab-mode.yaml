appId: com.vocabulario.app
tags:
  - import
  - ai-mock
---
# F-01 · Paste → Vocabulario cards (no second import mode)
- launchApp:
    clearState: false
- runFlow: ../../helpers/ensure-logged-in.yaml
- tapOn:
    id: tab_add
- tapOn:
    id: btn_import
- extendedWaitUntil:
    visible:
      id: import_paste_input
    timeout: 10000
- tapOn:
    id: import_paste_input
- inputText: "casa\nperro\ngato"
- tapOn:
    id: import_btn_start
- extendedWaitUntil:
    visible:
      id: "btn_import_confirm|btn_import_cancel|import_status_panel|import_review_modal"
    timeout: 90000
