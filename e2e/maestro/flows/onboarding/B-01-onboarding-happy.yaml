appId: com.vocabulario.app
tags:
  - regression
  - onboarding
---
# B-01 · Onboarding happy path
- launchApp:
    clearState: true
- extendedWaitUntil:
    visible:
      id: auth_toggle_mode
    timeout: 20000
- tapOn:
    id: auth_toggle_mode
- tapOn:
    id: auth_email
- eraseText
- inputRandomEmail
- tapOn:
    id: auth_password
- eraseText
- inputText: "e2e-test-pass-123"
- tapOn:
    id: auth_submit
- extendedWaitUntil:
    visible:
      id: onboarding_native_lang
    timeout: 45000
- runFlow: ../../helpers/complete-onboarding.yaml
- assertVisible:
    id: btn_learn
