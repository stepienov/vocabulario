appId: com.vocabulario.app
tags:
  - regression
  - settings
  - lang
---
# J-12 / J-13 · Open and dismiss L1/L2 language sheets
- launchApp:
    clearState: false
- runFlow: ../../helpers/ensure-logged-in.yaml
- runFlow: ../../helpers/goto-settings.yaml
- scrollUntilVisible:
    element:
      id: settings_native_lang
    direction: DOWN
    timeout: 15000
- assertVisible:
    id: settings_native_lang
- scrollUntilVisible:
    element:
      id: settings_learning_lang
    direction: DOWN
    timeout: 15000
- tapOn:
    id: settings_native_lang
- extendedWaitUntil:
    visible:
      id: settings_native_lang__sheet
    timeout: 10000
- pressKey: Back
- assertNotVisible:
    id: settings_native_lang__sheet
- tapOn:
    id: settings_learning_lang
- extendedWaitUntil:
    visible:
      id: settings_learning_lang__sheet
    timeout: 10000
- pressKey: Back
- assertNotVisible:
    id: settings_learning_lang__sheet
- tapOn:
    id: btn_back
