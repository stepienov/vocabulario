appId: com.vocabulario.app
tags:
  - regression
  - settings
  - lang
---
# J-11 · App language (L1) switch — open sheet, pick a language
- launchApp:
    clearState: false
- runFlow: ../../helpers/ensure-logged-in.yaml
- runFlow: ../../helpers/goto-settings.yaml
- scrollUntilVisible:
    element:
      id: settings_native_lang
    direction: DOWN
    timeout: 15000
- tapOn:
    id: settings_native_lang
- scrollUntilVisible:
    element:
      id: settings_native_lang__en
    direction: UP
    timeout: 10000
- tapOn:
    id: settings_native_lang__en
- tapOn:
    id: btn_back
- extendedWaitUntil:
    visible:
      id: tab_dashboard
    timeout: 20000
