name: CI

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    services:
      # Syntetyczna baza tylko na czas jobu; conftest wymaga localhost i nazwy *_test.
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: vocabulario
          POSTGRES_PASSWORD: vocabulario_ci
          POSTGRES_DB: vocabulario_ci_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U vocabulario -d vocabulario_ci_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    env:
      TEST_DATABASE_URL: postgresql+asyncpg://vocabulario:vocabulario_ci@localhost:5432/vocabulario_ci_test
      REQUIRE_PG_TESTS: "1"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/pyproject.toml

      - name: Install backend (dev)
        run: pip install -e "./backend[dev]"

      - name: UI strings, LSP sync, backend tests
        run: python scripts/ci_check.py

  android:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: android
    steps:
      - uses: actions/checkout@v4

      - uses: gradle/actions/wrapper-validation@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4

      - name: Unit tests, lint, debug build
        run: ./gradlew --console=plain :app:testDebugUnitTest :app:lintDebug :app:assembleDebug

      - name: Upload test and lint reports
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: android-reports
          path: |
            android/app/build/reports/
            android/app/build/test-results/
          retention-days: 7
